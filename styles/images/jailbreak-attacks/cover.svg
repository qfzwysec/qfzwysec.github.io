<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="越狱攻击文章封面">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7f3ea"/>
      <stop offset="1" stop-color="#ebe5d8"/>
    </linearGradient>
    <linearGradient id="red" x1="0" x2="1">
      <stop offset="0" stop-color="#d64b3f"/>
      <stop offset="1" stop-color="#8f2f2d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#2f2922" flood-opacity="0.13"/>
    </filter>
    <style>
      .title { font: 800 92px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #27231f; letter-spacing: 0; }
      .subtitle { font: 500 30px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6e6257; letter-spacing: 0; }
      .card-title { font: 700 30px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #2d2924; letter-spacing: 0; }
      .card-text { font: 500 22px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6a6056; letter-spacing: 0; }
      .small { font: 600 19px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #6d6258; letter-spacing: 0; }
      .label { font: 700 22px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #f7f3ea; letter-spacing: 0; }
      .line { fill: none; stroke: #b8483d; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .dash { fill: none; stroke: #b8483d; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 13 14; }
      .green { stroke: #577f69; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1250" cy="110" r="260" fill="#fffaf0" opacity="0.65"/>
  <circle cx="260" cy="810" r="280" fill="#ded6c6" opacity="0.45"/>

  <g transform="translate(94 76)">
    <text class="title" x="0" y="82">越狱攻击</text>
    <text class="subtitle" x="4" y="132">让模型做了本不该做的事情</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="96" y="220" width="360" height="180" rx="22" fill="#fffaf2" stroke="#d8cebd" stroke-width="2"/>
    <text class="card-title" x="126" y="272">注入 vs 越狱</text>
    <text class="card-text" x="126" y="318">注入：信任不可信内容</text>
    <text class="card-text" x="126" y="354">越狱：突破安全限制</text>
    <rect x="126" y="372" width="118" height="10" rx="5" fill="#577f69"/>
    <rect x="258" y="372" width="118" height="10" rx="5" fill="#b8483d"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="96" y="470" width="360" height="250" rx="22" fill="#fffaf2" stroke="#d8cebd" stroke-width="2"/>
    <text class="card-title" x="126" y="522">攻击类型</text>
    <g transform="translate(126 560)">
      <rect width="110" height="34" rx="17" fill="#efe8dc"/><text class="small" x="19" y="24">角色扮演</text>
      <rect x="126" width="110" height="34" rx="17" fill="#efe8dc"/><text class="small" x="145" y="24">场景构造</text>
      <rect y="52" width="110" height="34" rx="17" fill="#efe8dc"/><text class="small" x="19" y="76">逻辑诱导</text>
      <rect x="126" y="52" width="110" height="34" rx="17" fill="#efe8dc"/><text class="small" x="145" y="76">编码绕过</text>
      <rect y="104" width="110" height="34" rx="17" fill="#efe8dc"/><text class="small" x="19" y="128">上下文耗尽</text>
      <rect x="126" y="104" width="110" height="34" rx="17" fill="#efe8dc"/><text class="small" x="145" y="128">多轮冲淡</text>
    </g>
  </g>

  <g transform="translate(546 184)" filter="url(#shadow)">
    <rect x="0" y="0" width="508" height="508" rx="46" fill="#fcf8ef" stroke="#d8cebd" stroke-width="2"/>
    <circle cx="254" cy="254" r="182" fill="none" stroke="#d7cdbc" stroke-width="22"/>
    <circle cx="254" cy="254" r="126" fill="none" stroke="#d7cdbc" stroke-width="22"/>
    <circle cx="254" cy="254" r="70" fill="#2d2b28"/>
    <path d="M221 238h66l28 48h-122z" fill="#faf7ef"/>
    <circle cx="254" cy="230" r="24" fill="#faf7ef"/>
    <text class="label" x="202" y="438">安全边界</text>
    <path class="line" d="M-90 78 C52 92 42 200 146 204 C234 208 205 293 300 298 C400 305 388 407 586 424"/>
    <path class="dash" d="M-80 355 C72 332 96 410 222 370 C318 338 372 222 584 224"/>
    <path d="M587 424l-28-24 2 45z" fill="#b8483d"/>
    <path d="M584 224l-30-20 9 43z" fill="#b8483d"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="1130" y="130" width="372" height="154" rx="20" fill="#fffaf2" stroke="#d8cebd" stroke-width="2"/>
    <text class="card-title" x="1160" y="180">内部崩塌</text>
    <text class="card-text" x="1160" y="222">validator 补全缺口</text>
    <rect x="1350" y="164" width="92" height="76" rx="12" fill="#f2ecdf" stroke="#cfc4b2"/>
    <rect x="1370" y="184" width="50" height="12" rx="6" fill="#8f8378"/>
    <rect x="1370" y="208" width="36" height="12" rx="6" fill="#d14b40"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="1130" y="330" width="372" height="154" rx="20" fill="#fffaf2" stroke="#d8cebd" stroke-width="2"/>
    <text class="card-title" x="1160" y="380">合法场景包装</text>
    <text class="card-text" x="1160" y="422">把违规请求伪装成任务</text>
    <rect x="1360" y="358" width="78" height="92" rx="10" fill="#f2ecdf" stroke="#cfc4b2"/>
    <path d="M1378 390h42M1378 414h36" stroke="#8f8378" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="1130" y="530" width="372" height="154" rx="20" fill="#fffaf2" stroke="#d8cebd" stroke-width="2"/>
    <text class="card-title" x="1160" y="580">双密钥绕过</text>
    <text class="card-text" x="1160" y="622">假密钥正常，真密钥触发</text>
    <circle cx="1368" cy="600" r="23" fill="none" stroke="#577f69" stroke-width="10"/>
    <path d="M1390 600h54M1422 600v22" stroke="#577f69" stroke-width="10" stroke-linecap="round"/>
    <circle cx="1368" cy="642" r="23" fill="none" stroke="#b8483d" stroke-width="10"/>
    <path d="M1390 642h54M1422 642v22" stroke="#b8483d" stroke-width="10" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="590" y="730" width="610" height="106" rx="22" fill="#fffaf2" stroke="#d8cebd" stroke-width="2"/>
    <text class="card-title" x="620" y="788">多模态图像越狱</text>
    <text class="card-text" x="860" y="788">文字嵌入图像 / 对抗性扰动</text>
    <rect x="1088" y="754" width="72" height="52" rx="8" fill="#e4e0d5" stroke="#bfb5a5"/>
    <rect x="1108" y="766" width="10" height="10" fill="#b8483d"/>
    <rect x="1130" y="782" width="8" height="8" fill="#b8483d"/>
  </g>

  <g transform="translate(92 786)">
    <rect width="332" height="44" rx="22" fill="#2d2b28"/>
    <text class="label" x="24" y="30">AI 安全 / 模型安全</text>
  </g>
</svg>
